<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Normal Probability Explorer</title><style>body{font-family:Arial,sans-serif;margin:0;color:#1f2937;background:#fff;font-size:14px}.wrap{padding:14px;max-width:680px;margin:auto}h2{font-size:16px;font-weight:600;color:#581c87;margin:0 0 6px}p{margin:5px 0 10px}.settings{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.settings label{font-size:13px}select,input[type=range]{accent-color:#ad14d7}select,input[type=number]{padding:5px;border:1px solid #cbd5e1;border-radius:5px}input[type=range]{width:100%;margin-top:9px}.numbers{display:flex;gap:15px;justify-content:space-between;font-size:13px;flex-wrap:wrap}.result{color:#581c87;font-weight:600}svg{width:100%;height:auto;display:block;margin-top:8px}.sub{color:#64748b;font-size:12px}.cut-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cut-row input{width:86px;font:inherit}.cut-row button{padding:4px 10px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:5px;cursor:pointer;font-size:15px}.cut-row button:hover{background:#f3e8ff}.cut-row label{font-weight:600}#error{color:#b91c1c;min-height:1em}</style></head><body><main class="wrap"><h2>Explore the shaded area</h2><p>Choose a direction and move the cutoff marker, or type an exact value.</p><div class="settings"><label>Shaded region: <select id="direction"><option value="left">At or below cutoff (left)</option><option value="right">At or above cutoff (right)</option></select></label><span id="parameters" class="sub"></span></div><svg id="graph" viewBox="0 0 640 220" role="img" aria-label="Normal distribution curve with adjustable cutoff and shaded area"></svg><div class="cut-row"><label for="cutNum">Cutoff:</label><button id="decrease" type="button" aria-label="Decrease cutoff by 0.1">−</button><input type="number" id="cutNum" step="0.1" inputmode="decimal"><button id="increase" type="button" aria-label="Increase cutoff by 0.1">+</button><span id="unitLabel" class="sub"></span></div><label for="cutoff" style="display:block;margin-top:10px">Or drag the cutoff:</label><input type="range" id="cutoff" step="0.1"><div class="numbers"><span id="cutoffLabel"></span><span class="result" id="result" aria-live="polite"></span></div><p id="error" class="sub" aria-live="polite"></p><p class="sub">Practice tool only. It does not submit or grade an answer.</p></main><script>
const q=new URLSearchParams(location.search);const finite=(k,f)=>{const n=Number(q.get(k));return Number.isFinite(n)&&q.has(k)?n:f};const mu=finite('mu',24),sigma=Math.max(.1,finite('sd',1.2));const dir=q.get('tail')==='right'?'right':'left';const units=q.get('unit')==='lb'?'lb':'cm';const inp=document.getElementById('cutoff'),num=document.getElementById('cutNum'),sel=document.getElementById('direction'),err=document.getElementById('error');sel.value=dir;const low=Math.floor((mu-4*sigma)*10)/10,high=Math.ceil((mu+4*sigma)*10)/10;inp.min=low.toFixed(1);inp.max=high.toFixed(1);inp.step='0.1';inp.value=mu.toFixed(1);num.min=inp.min;num.max=inp.max;num.value=mu.toFixed(1);document.getElementById('parameters').textContent='Mean = '+mu.toFixed(1)+' '+units+'; SD = '+sigma.toFixed(1)+' '+units;document.getElementById('unitLabel').textContent=units;
function erf(x){const sign=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return sign*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}function cdf(x){return .5*(1+erf((x-mu)/(sigma*Math.sqrt(2))))}function pdf(x){const z=(x-mu)/sigma;return Math.exp(-z*z/2)}function setCut(v){if(!Number.isFinite(v)){err.textContent='Enter a numerical cutoff.';return}const bounded=Math.max(low,Math.min(high,Math.round(v*10)/10));err.textContent=v<low||v>high?'Cutoff limited to graph range.':'';inp.value=bounded.toFixed(1);num.value=bounded.toFixed(1);draw()}
function draw(){const cut=Number(inp.value),left=sel.value==='left',area=left?cdf(cut):1-cdf(cut);document.getElementById('cutoffLabel').textContent='Cutoff: '+cut.toFixed(1)+' '+units;document.getElementById('result').textContent='Shaded area: '+(area*100).toFixed(1)+'%';const x0=low,x1=high,X=v=>35+(v-x0)/(x1-x0)*570,Y=v=>180-137*pdf(v);let curve='';for(let i=0;i<=220;i++){const v=x0+(x1-x0)*i/220;curve+=(i?' L':'M')+X(v).toFixed(2)+' '+Y(v).toFixed(2)}const start=left?x0:Math.max(cut,x0),end=left?Math.min(cut,x1):x1;let shade='M'+X(start)+' 180';for(let i=0;i<=120;i++){const v=start+(end-start)*i/120;shade+=' L'+X(v)+' '+Y(v)}shade+=' L'+X(end)+' 180 Z';const mark=X(cut);document.getElementById('graph').innerHTML='<path d="'+shade+'" fill="#ad14d7" fill-opacity=".30"/><path d="'+curve+'" fill="none" stroke="#581c87" stroke-width="2.7"/><line x1="35" y1="180" x2="605" y2="180" stroke="#64748b"/><line x1="'+X(mu)+'" y1="40" x2="'+X(mu)+'" y2="180" stroke="#94a3b8" stroke-dasharray="4 5"/><line x1="'+mark+'" y1="'+Y(cut)+'" x2="'+mark+'" y2="180" stroke="#ad14d7" stroke-width="2"/><polygon points="'+(mark-6)+',185 '+(mark+6)+',185 '+mark+',174" fill="#ad14d7"/><text x="'+X(mu)+'" y="200" font-size="13" text-anchor="middle" fill="#64748b">Mean '+mu.toFixed(1)+'</text><text x="'+mark+'" y="218" font-size="13" text-anchor="middle" fill="#581c87">Cutoff '+cut.toFixed(1)+'</text>'}
sel.addEventListener('change',draw);inp.addEventListener('input',()=>{num.value=Number(inp.value).toFixed(1);err.textContent='';draw()});num.addEventListener('change',()=>setCut(Number(num.value)));num.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();num.blur()}});document.getElementById('decrease').addEventListener('click',()=>setCut(Number(inp.value)-.1));document.getElementById('increase').addEventListener('click',()=>setCut(Number(inp.value)+.1));draw();
</script></body></html>
