<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Normal Probability Explorer</title><style>body{font-family:Arial,sans-serif;margin:0;color:#1f2937;background:white;font-size:14px}.wrap{padding:14px;max-width:680px;margin:auto}h2{font-size:16px;font-weight:600;color:#581c87;margin:0 0 6px}p{margin:5px 0 10px}.settings{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.settings label{font-size:13px}select,input[type=range]{accent-color:#ad14d7}select{padding:5px;border:1px solid #cbd5e1;border-radius:5px}input[type=range]{width:100%;margin-top:9px}.numbers{display:flex;gap:15px;justify-content:space-between;font-size:13px}.result{color:#581c87;font-weight:600}svg{width:100%;height:auto;display:block;margin-top:8px}.sub{color:#64748b;font-size:12px}</style></head><body><main class="wrap"><h2>Explore the shaded area</h2><p>Choose a direction and drag the cutoff marker. Try matching the value in your homework.</p><div class="settings"><label>Shaded region: <select id="direction"><option value="left">At or below cutoff (left)</option><option value="right">At or above cutoff (right)</option></select></label><span id="parameters" class="sub"></span></div><svg id="graph" viewBox="0 0 640 220" role="img" aria-label="Normal distribution curve with adjustable cutoff and shaded area"></svg><label for="cutoff" style="display:block">Drag to change the cutoff:</label><input type="range" id="cutoff"><div class="numbers"><span id="cutoffLabel"></span><span class="result" id="result" aria-live="polite"></span></div><p class="sub">Practice tool only. It does not submit or grade an answer.</p></main><script>
const q=new URLSearchParams(location.search);const finite=(k,f)=>{const n=Number(q.get(k));return Number.isFinite(n)&&q.has(k)?n:f};const mu=finite('mu',24),sigma=Math.max(.1,Math.min(10,finite('sd',1.2)));const target=finite('target',mu);const dir=q.get('tail')==='right'?'right':'left';const inp=document.getElementById('cutoff'),sel=document.getElementById('direction');sel.value=dir;inp.min=(mu-4*sigma).toFixed(2);inp.max=(mu+4*sigma).toFixed(2);inp.step='0.1';inp.value=mu;document.getElementById('parameters').textContent='Mean = '+mu.toFixed(1)+' cm; SD = '+sigma.toFixed(1)+' cm';function erf(x){const sign=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return sign*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}function cdf(x){return .5*(1+erf((x-mu)/(sigma*Math.sqrt(2))))}function pdf(x){const z=(x-mu)/sigma;return Math.exp(-z*z/2)}function draw(){const cut=+inp.value,left=sel.value==='left',area=left?cdf(cut):1-cdf(cut);document.getElementById('cutoffLabel').textContent='Cutoff: '+cut.toFixed(1)+' cm';document.getElementById('result').textContent='Shaded area: '+(area*100).toFixed(1)+'%';const x0=mu-4*sigma,x1=mu+4*sigma,X=v=>35+(v-x0)/(x1-x0)*570,Y=v=>180-137*pdf(v);let curve='',shade='',pts=[];for(let i=0;i<=220;i++){let v=x0+(x1-x0)*i/220;curve+=(i?' L':'M')+X(v).toFixed(2)+' '+Y(v).toFixed(2);if((left&&v<=cut)||(!left&&v>=cut))pts.push([v,Y(v)])}const start=left?x0:Math.max(cut,x0),end=left?Math.min(cut,x1):x1;shade='M'+X(start)+' 180';for(let i=0;i<=120;i++){const v=start+(end-start)*i/120;shade+=' L'+X(v)+' '+Y(v)}shade+=' L'+X(end)+' 180 Z';const safeCut=Math.min(x1,Math.max(x0,cut));document.getElementById('graph').innerHTML='<path d="'+shade+'" fill="#ad14d7" fill-opacity=".30"/><path d="'+curve+'" fill="none" stroke="#581c87" stroke-width="2.7"/><line x1="35" y1="180" x2="605" y2="180" stroke="#64748b"/><line x1="'+X(mu)+'" y1="40" x2="'+X(mu)+'" y2="180" stroke="#94a3b8" stroke-dasharray="4 5"/><line x1="'+X(safeCut)+'" y1="'+Y(safeCut)+'" x2="'+X(safeCut)+'" y2="180" stroke="#ad14d7" stroke-width="2"/><polygon points="'+(X(safeCut)-6)+',185 '+(X(safeCut)+6)+',185 '+X(safeCut)+',174" fill="#ad14d7"/><text x="'+X(mu)+'" y="200" font-size="13" text-anchor="middle" fill="#64748b">Mean '+mu.toFixed(1)+'</text><text x="'+X(safeCut)+'" y="218" font-size="13" text-anchor="middle" fill="#581c87">Cutoff '+safeCut.toFixed(1)+'</text>';}sel.addEventListener('change',draw);inp.addEventListener('input',draw);draw();
</script></body></html>
